name: Deploy (CI/CD)

# Deploys the Earthquake Monitoring Dashboard to Vercel.
# Flow: lint -> test -> build -> terraform (IaC) -> deploy to Vercel.
# All secrets come from GitHub Actions Secrets. No .env file is ever used.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Provision & Deploy
    runs-on: ubuntu-latest

    env:
      # --- App secret(s), injected into Terraform via TF_VAR_* ---
      TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
      TF_VAR_vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}
      TF_VAR_vite_api_url: ${{ secrets.VITE_API_URL }}
      # --- Vercel CLI auth ---
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          # Used only if you enabled the HCP Terraform `cloud {}` remote
          # state backend in infra/providers.tf. Safe to leave empty otherwise.
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform -chdir=infra init -input=false

      - name: Terraform Validate
        run: terraform -chdir=infra validate

      - name: Terraform Plan
        run: terraform -chdir=infra plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform -chdir=infra apply -input=false -auto-approve tfplan

      - name: Read Vercel project ID from Terraform
        id: tf
        run: echo "project_id=$(terraform -chdir=infra output -raw project_id)" >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (production)
        env:
          VERCEL_PROJECT_ID: ${{ steps.tf.outputs.project_id }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel (uses Terraform-managed env vars)
        env:
          VERCEL_PROJECT_ID: ${{ steps.tf.outputs.project_id }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to Vercel (production)
        env:
          VERCEL_PROJECT_ID: ${{ steps.tf.outputs.project_id }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
