services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3005:3005'
    environment:
      PORT: 3005
      USGS_API_URL: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary
      CACHE_TTL: 60
      RATE_LIMIT_ENABLED: false
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
      NODE_ENV: production
      LOG_LEVEL: info
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3005/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3005/api
    ports:
      - '5174:80'
    depends_on:
      backend:
        condition: service_healthy
